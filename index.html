<!-- shader for bird's position -->
<script id="fragmentShaderPosition" type="x-shader/x-fragment">

	uniform float time;
	uniform float delta;

	void main()	{

		vec2 uv = gl_FragCoord.xy / resolution.xy;
		vec4 tmpPos = texture2D( texturePosition, uv );
		vec3 position = tmpPos.xyz;
		vec3 velocity = texture2D( textureVelocity, uv ).xyz;

		float phase = tmpPos.w;

		phase = mod( ( phase + delta +
			length( velocity.xz ) * delta * 3. +
			max( velocity.y, 0.0 ) * delta * 6. ), 62.83 );

		gl_FragColor = vec4( position + velocity * delta * 15. , phase );

	}

</script>

<!-- shader for bird's velocity -->
<script id="fragmentShaderVelocity" type="x-shader/x-fragment">

	uniform float time;
	uniform float testing;
	uniform float delta; // about 0.016
	uniform float seperationDistance; // 20
	uniform float alignmentDistance; // 40
	uniform float cohesionDistance; //
	uniform float freedomFactor;
	uniform vec3 predator;
	uniform float predatorSign;  // +1 flee, -1 gather (pointer held, or a link under the cursor)
	uniform float predatorForce; // 0..1, fades a parked cursor out so the flock re-centres

	const float width = resolution.x;
	const float height = resolution.y;

	const float PI = 3.141592653589793;
	const float PI_2 = PI * 2.0;
	// const float VISION = PI * 0.55;

	float zoneRadius = 40.0;
	float zoneRadiusSquared = 1600.0;

	float separationThresh = 0.45;
	float alignmentThresh = 0.65;

	const float UPPER_BOUNDS = BOUNDS;
	const float LOWER_BOUNDS = -UPPER_BOUNDS;

	const float SPEED_LIMIT = 9.0;

	float rand(vec2 co){
		return fract(sin(dot(co.xy ,vec2(12.9898,78.233))) * 43758.5453);
	}

	void main() {

		zoneRadius = seperationDistance + alignmentDistance + cohesionDistance;
		separationThresh = seperationDistance / zoneRadius;
		alignmentThresh = ( seperationDistance + alignmentDistance ) / zoneRadius;
		zoneRadiusSquared = zoneRadius * zoneRadius;


		vec2 uv = gl_FragCoord.xy / resolution.xy;
		vec3 birdPosition, birdVelocity;

		vec3 selfPosition = texture2D( texturePosition, uv ).xyz;
		vec3 selfVelocity = texture2D( textureVelocity, uv ).xyz;

		float dist;
		vec3 dir; // direction
		float distSquared;

		float seperationSquared = seperationDistance * seperationDistance;
		float cohesionSquared = cohesionDistance * cohesionDistance;

		float f;
		float percent;

		vec3 velocity = selfVelocity;

		float limit = SPEED_LIMIT;

		dir = predator * UPPER_BOUNDS - selfPosition;
		dir.z = 0.;
		// dir.z *= 0.6;
		dist = length( dir );
		distSquared = dist * dist;

		// gathering reaches further and pulls softer than fleeing, or it collapses into a knot
		float preyRadius = predatorSign > 0.0 ? 150.0 : 200.0;
		float preyGain = predatorSign > 0.0 ? 100.0 : 55.0;
		float preyRadiusSq = preyRadius * preyRadius;


		// move birds away from predator
		if (dist < preyRadius) {

			f = ( distSquared / preyRadiusSq - 1.0 ) * delta * preyGain;
			velocity += normalize( dir ) * f * predatorSign * predatorForce;
			limit += 5.0 * predatorForce;

		}


		// if (testing == 0.0) {}
		// if ( rand( uv + time ) < freedomFactor ) {}


		// Attract flocks to the center
		vec3 central = vec3( 0., 0., 0. );
		dir = selfPosition - central;
		dist = length( dir );

		dir.y *= 2.5;
		velocity -= normalize( dir ) * delta * 5.;

		for (float y=0.0;y<height;y++) {
			for (float x=0.0;x<width;x++) {

				vec2 ref = vec2( x + 0.5, y + 0.5 ) / resolution.xy;
				birdPosition = texture2D( texturePosition, ref ).xyz;

				dir = birdPosition - selfPosition;
				dist = length(dir);

				if (dist < 0.0001) continue;

				distSquared = dist * dist;

				if (distSquared > zoneRadiusSquared ) continue;

				percent = distSquared / zoneRadiusSquared;

				if ( percent < separationThresh ) { // low

					// Separation - Move apart for comfort
					f = (separationThresh / percent - 1.0) * delta;
					velocity -= normalize(dir) * f;

				} else if ( percent < alignmentThresh ) { // high

					// Alignment - fly the same direction
					float threshDelta = alignmentThresh - separationThresh;
					float adjustedPercent = ( percent - separationThresh ) / threshDelta;

					birdVelocity = texture2D( textureVelocity, ref ).xyz;

					f = ( 0.5 - cos( adjustedPercent * PI_2 ) * 0.5 + 0.5 ) * delta;
					velocity += normalize(birdVelocity) * f;

				} else {

					// Attraction / Cohesion - move closer
					float threshDelta = 1.0 - alignmentThresh;
					float adjustedPercent = ( percent - alignmentThresh ) / threshDelta;

					f = ( 0.5 - ( cos( adjustedPercent * PI_2 ) * -0.5 + 0.5 ) ) * delta;

					velocity += normalize(dir) * f;

				}

			}

		}



		// this make tends to fly around than down or up
		// if (velocity.y > 0.) velocity.y *= (1. - 0.2 * delta);

		// Speed Limits
		if ( length( velocity ) > limit ) {
			velocity = normalize( velocity ) * limit;
		}

		gl_FragColor = vec4( velocity, 1.0 );

	}

</script>

<script type="x-shader/x-vertex" id="birdVS">

	attribute vec2 reference;
	attribute float birdVertex;

	attribute vec3 birdColor;

	uniform sampler2D texturePosition;
	uniform sampler2D textureVelocity;

	varying vec3 vColor;
	varying float vSheen;
	varying float vDepth;

	uniform float time;

	// one fixed light, high and slightly behind: birds flash as they bank into it
	const vec3 KEY = vec3( 0.35, 0.9, 0.2 );

	void main() {

		vec4 tmpPos = texture2D( texturePosition, reference );
		vec3 pos = tmpPos.xyz;
		vec3 velocity = normalize(texture2D( textureVelocity, reference ).xyz);

		vSheen = 0.5 + 0.5 * dot( velocity, normalize( KEY ) );

		vec3 newPosition = position;

		if ( birdVertex == 4.0 || birdVertex == 7.0 ) {
			// flap wings
			newPosition.y = sin( tmpPos.w ) * 5.;
		}

		newPosition = mat3( modelMatrix ) * newPosition;


		velocity.z *= -1.;
		float xz = length( velocity.xz );
		float xyz = 1.;
		float x = sqrt( 1. - velocity.y * velocity.y );

		float cosry = velocity.x / xz;
		float sinry = velocity.z / xz;

		float cosrz = x / xyz;
		float sinrz = velocity.y / xyz;

		mat3 maty =  mat3(
			cosry, 0, -sinry,
			0    , 1, 0     ,
			sinry, 0, cosry

		);

		mat3 matz =  mat3(
			cosrz , sinrz, 0,
			-sinrz, cosrz, 0,
			0     , 0    , 1
		);

		newPosition =  maty * matz * newPosition;
		newPosition += pos;

		vColor = birdColor;

		vec4 viewPosition = viewMatrix * vec4( newPosition, 1.0 );
		vDepth = -viewPosition.z;

		gl_Position = projectionMatrix * viewPosition;
	}

</script>

<!-- bird geometry shader -->
<script type="x-shader/x-fragment" id="birdFS">

	varying vec3 vColor;
	varying float vSheen;
	varying float vDepth;

	const vec3 BODY = vec3( 0.847, 0.831, 0.784 );

	void main() {

		// birdColor still carries the old per-bird ramp (0.27..0.67); re-centre it as a tone variance
		float tone = 0.72 + 0.42 * vColor.x;

		vec3 body = BODY * tone * ( 0.62 + 0.78 * vSheen );

		// the flock has no edge: distance dissolves it into the page
		float fade = 1.0 - smoothstep( 480.0, 1250.0, vDepth );

		gl_FragColor = vec4( body * fade, 1.0 );

	}

</script>


<script>

	var BOUNDS = 800, BOUNDS_HALF = BOUNDS / 2;

	var small = window.matchMedia( '(pointer: coarse)' ).matches || window.innerWidth < 700;
	var hoverable = window.matchMedia( '(hover: hover)' ).matches;
	var slowly = window.matchMedia( '(prefers-reduced-motion: reduce)' ).matches;

	// texture width, so bird count is WIDTH squared. ?birds=N overrides and disables the auto-downgrade.
	var ladder = small ? [ 24, 16 ] : [ 64, 32, 22, 14 ];
	var rung = 0;
	var asked = parseInt( new URLSearchParams( location.search ).get( 'birds' ), 10 );
	var pinned = isFinite( asked );
	var WIDTH = pinned ? Math.min( 64, Math.max( 8, asked ) ) : ladder[ rung ];
	// the reference attribute aliases through the sim texture by triangle index, which only
	// resolves to whole birds when WIDTH² % 3 != 0 — widths divisible by 3 shred the flock
	if ( WIDTH % 3 === 0 ) WIDTH += 1;

	var container = document.getElementById( 'sky' );
	var camera, scene, renderer;
	var gpuCompute, positionVariable, velocityVariable, positionUniforms, velocityUniforms, birdUniforms, birdMesh;

	var windowHalfX = window.innerWidth / 2;
	var windowHalfY = window.innerHeight / 2;

	// predator target lives in the same space as the cursor: pixels offset from the viewport centre
	var mouseX = 0, mouseY = 0;
	var moved = -1e9;      // timestamp of the last real pointer movement
	var held = false;      // pointer down anywhere
	var leaning = null;    // { x, y } centre of the link under the cursor

	// mobile tilt
	var tiltX = 0, tiltY = 0;
	var useGyroscope = false;
	var gyroscopeAvailable = false;
	var iosPermissionRequested = false;
	var touchOverride = false, touchOverrideTimeout;
	var isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test( navigator.userAgent );

	var raf = 0, last = 0, ready = false;
	var watching = ! pinned && ladder.length > 1;
	var fpsSince = 0, fpsFrames = 0;

	if ( WEBGL.isWebGLAvailable() ) {

		try {

			init();
			build();
			start();
			note();

		} catch ( e ) {

			grounded( e );

		}

	} else {

		document.documentElement.classList.add( 'ready' );

	}

	// some GPUs pass the WebGL check but can't run the sim (no float textures, no vertex
	// texture fetch). the page must never be blank because the birds stayed home.
	function grounded( e ) {

		cancelAnimationFrame( raf );
		raf = 0;
		document.documentElement.classList.add( 'ready' );
		if ( container.parentNode ) container.parentNode.removeChild( container );
		console.error( 'the birds stayed home:', e );

	}

	function init() {

		camera = new THREE.PerspectiveCamera( 75, window.innerWidth / window.innerHeight, 1, 3000 );
		camera.position.z = 350;

		scene = new THREE.Scene();

		renderer = new THREE.WebGLRenderer( { antialias: window.devicePixelRatio < 2 } );
		renderer.setClearColor( 0x000000, 1 );
		renderer.setPixelRatio( Math.min( window.devicePixelRatio, 2 ) );
		renderer.setSize( window.innerWidth, window.innerHeight );
		container.appendChild( renderer.domElement );

		window.addEventListener( 'resize', onWindowResize, false );
		document.addEventListener( 'mousemove', onDocumentMouseMove, false );
		document.addEventListener( 'touchstart', onDocumentTouchStart, { passive: true } );
		document.addEventListener( 'touchmove', onDocumentTouchMove, { passive: true } );
		document.addEventListener( 'touchend', onDocumentTouchEnd, false );
		window.addEventListener( 'pointerdown', function ( event ) {

			// right-click opens a context menu whose pointerup never arrives; only the
			// primary button may gather the flock
			if ( event.button === 0 ) held = true;

		}, false );
		[ 'pointerup', 'pointercancel', 'blur', 'contextmenu' ].forEach( function ( name ) {

			window.addEventListener( name, function () { held = false; }, false );

		} );
		document.addEventListener( 'visibilitychange', onVisibilityChange, false );

		if ( hoverable ) {

			var links = document.querySelectorAll( 'nav a' );

			for ( var i = 0; i < links.length; i ++ ) {

				links[ i ].addEventListener( 'mouseenter', onLinkEnter, false );
				links[ i ].addEventListener( 'mouseleave', onLinkLeave, false );

			}

		}

		if ( isMobile ) initGyroscope();

	}

	function build() {

		gpuCompute = new GPUComputationRenderer( WIDTH, WIDTH, renderer );

		var dtPosition = gpuCompute.createTexture();
		var dtVelocity = gpuCompute.createTexture();
		fillPositionTexture( dtPosition );
		fillVelocityTexture( dtVelocity );

		velocityVariable = gpuCompute.addVariable( "textureVelocity", document.getElementById( 'fragmentShaderVelocity' ).textContent, dtVelocity );
		positionVariable = gpuCompute.addVariable( "texturePosition", document.getElementById( 'fragmentShaderPosition' ).textContent, dtPosition );

		gpuCompute.setVariableDependencies( velocityVariable, [ positionVariable, velocityVariable ] );
		gpuCompute.setVariableDependencies( positionVariable, [ positionVariable, velocityVariable ] );

		positionUniforms = positionVariable.material.uniforms;
		velocityUniforms = velocityVariable.material.uniforms;

		positionUniforms.time = { value: 0.0 };
		positionUniforms.delta = { value: 0.0 };
		velocityUniforms.time = { value: 1.0 };
		velocityUniforms.delta = { value: 0.0 };
		velocityUniforms.testing = { value: 1.0 };
		velocityUniforms.seperationDistance = { value: 20.0 };
		velocityUniforms.alignmentDistance = { value: 20.0 };
		velocityUniforms.cohesionDistance = { value: 20.0 };
		velocityUniforms.freedomFactor = { value: 0.75 };
		velocityUniforms.predator = { value: new THREE.Vector3() };
		velocityUniforms.predatorSign = { value: 1.0 };
		velocityUniforms.predatorForce = { value: 0.0 };
		velocityVariable.material.defines.BOUNDS = BOUNDS.toFixed( 2 );

		velocityVariable.wrapS = THREE.RepeatWrapping;
		velocityVariable.wrapT = THREE.RepeatWrapping;
		positionVariable.wrapS = THREE.RepeatWrapping;
		positionVariable.wrapT = THREE.RepeatWrapping;

		var error = gpuCompute.init();
		if ( error !== null ) throw new Error( error );

		birdUniforms = {
			texturePosition: { value: null },
			textureVelocity: { value: null },
			time: { value: 1.0 },
			delta: { value: 0.0 }
		};

		birdMesh = new THREE.Mesh( birdGeometry( WIDTH ), new THREE.ShaderMaterial( {
			uniforms: birdUniforms,
			vertexShader: document.getElementById( 'birdVS' ).textContent,
			fragmentShader: document.getElementById( 'birdFS' ).textContent,
			side: THREE.DoubleSide
		} ) );

		birdMesh.rotation.y = Math.PI / 2;
		birdMesh.matrixAutoUpdate = false;
		birdMesh.updateMatrix();

		scene.add( birdMesh );

	}

	function teardown() {

		scene.remove( birdMesh );
		birdMesh.geometry.dispose();
		birdMesh.material.dispose();

		for ( var i = 0; i < gpuCompute.variables.length; i ++ ) {

			var v = gpuCompute.variables[ i ];
			v.renderTargets[ 0 ].dispose();
			v.renderTargets[ 1 ].dispose();
			v.initialValueTexture.dispose();
			v.material.dispose();

		}

	}

	// Custom Geometry - using 3 triangles each. No UVs, no normals currently.
	function birdGeometry( width ) {

		var birds = width * width;
		var triangles = birds * 3;
		var points = triangles * 3;

		var geometry = new THREE.BufferGeometry();

		var vertices = new THREE.BufferAttribute( new Float32Array( points * 3 ), 3 );
		var birdColors = new THREE.BufferAttribute( new Float32Array( points * 3 ), 3 );
		var references = new THREE.BufferAttribute( new Float32Array( points * 2 ), 2 );
		var birdVertex = new THREE.BufferAttribute( new Float32Array( points ), 1 );

		geometry.addAttribute( 'position', vertices );
		geometry.addAttribute( 'birdColor', birdColors );
		geometry.addAttribute( 'reference', references );
		geometry.addAttribute( 'birdVertex', birdVertex );

		var v = 0;

		function verts_push() {

			for ( var i = 0; i < arguments.length; i ++ ) vertices.array[ v ++ ] = arguments[ i ];

		}

		var wingsSpan = 20;

		for ( var f = 0; f < birds; f ++ ) {

			// Body
			verts_push(
				0, - 0, - 20,
				0, 4, - 20,
				0, 0, 30
			);

			// Left Wing
			verts_push(
				0, 0, - 15,
				- wingsSpan, 0, 0,
				0, 0, 15
			);

			// Right Wing
			verts_push(
				0, 0, 15,
				wingsSpan, 0, 0,
				0, 0, - 15
			);

		}

		for ( var w = 0; w < triangles * 3; w ++ ) {

			var i = ~ ~ ( w / 3 );
			var x = ( i % width ) / width;
			var y = ~ ~ ( i / width ) / width;

			var c = new THREE.Color(
				0x444444 +
				~ ~ ( w / 9 ) / birds * 0x666666
			);

			birdColors.array[ w * 3 + 0 ] = c.r;
			birdColors.array[ w * 3 + 1 ] = c.g;
			birdColors.array[ w * 3 + 2 ] = c.b;

			references.array[ w * 2 ] = x;
			references.array[ w * 2 + 1 ] = y;

			birdVertex.array[ w ] = w % 9;

		}

		geometry.scale( 0.24, 0.24, 0.24 );

		return geometry;

	}

	function fillPositionTexture( texture ) {

		var theArray = texture.image.data;

		for ( var k = 0, kl = theArray.length; k < kl; k += 4 ) {

			theArray[ k + 0 ] = Math.random() * BOUNDS - BOUNDS_HALF;
			theArray[ k + 1 ] = Math.random() * BOUNDS - BOUNDS_HALF;
			theArray[ k + 2 ] = Math.random() * BOUNDS - BOUNDS_HALF;
			theArray[ k + 3 ] = 1;

		}

	}

	function fillVelocityTexture( texture ) {

		var theArray = texture.image.data;

		for ( var k = 0, kl = theArray.length; k < kl; k += 4 ) {

			theArray[ k + 0 ] = ( Math.random() - 0.5 ) * 10;
			theArray[ k + 1 ] = ( Math.random() - 0.5 ) * 10;
			theArray[ k + 2 ] = ( Math.random() - 0.5 ) * 10;
			theArray[ k + 3 ] = 1;

		}

	}

	function onWindowResize() {

		windowHalfX = window.innerWidth / 2;
		windowHalfY = window.innerHeight / 2;

		camera.aspect = window.innerWidth / window.innerHeight;
		camera.updateProjectionMatrix();

		renderer.setSize( window.innerWidth, window.innerHeight );

		leaning = null;

	}

	function onDocumentMouseMove( event ) {

		mouseX = event.clientX - windowHalfX;
		mouseY = event.clientY - windowHalfY;
		moved = performance.now();

	}

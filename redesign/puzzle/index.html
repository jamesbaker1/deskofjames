<style>
    * { margin: 0; padding: 0; box-sizing: border-box }

    body {
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 30px;
        padding: 1.5rem;
        background: #f7f5f0;
        color: #1a1917;
        font: 12.5px/1.6 ui-monospace, "SF Mono", "Cascadia Code", Menlo, Consolas, monospace;
    }

    a {
        color: #706c63;
        text-decoration: none;
        border-bottom: 1px solid transparent;
        transition: color 120ms ease, border-color 120ms ease;
    }

    a:hover { color: #1a1917; border-bottom-color: #1a1917 }

    .home { position: fixed; top: 26px; left: 26px }
    .mail { position: fixed; bottom: 26px; right: 26px }

    canvas { display: block; cursor: crosshair }

    /* The engine adds .solved to <body> once the nine dots are covered. */
    .payoff { display: none; text-align: center }

    body.solved .payoff { display: block }

    .payoff p { margin-bottom: 14px }
</style>

<body>
<a class="home" href="/redesign/">← home</a>
<a class="mail" href="mailto:james@deskofjim.com">james@deskofjim.com</a>

<canvas id="canvas-nine-dots-puzzle" width="400" height="400"
    data-colour_background="#f7f5f0"
    data-colour_neutral="#b3afa5"
    data-colour_success="#1a1917"
    data-colour_fail="#b0512f"
    data-colour_face="#f7f5f0"
    data-colour_text="#706c63"
    data-colour_text_background_dark="#eceae3"
    data-colour_text_background_light="#f2f0e9"></canvas>
<script>
    // Sized here because the deferred engine reads width/height once and hit-tests
    // in canvas pixels — CSS must never scale the canvas.
    {
        const canvas = document.getElementById('canvas-nine-dots-puzzle');
        canvas.width = canvas.height = Math.min(400, Math.min(innerWidth, innerHeight) - 72);
    }
</script>

<div class="payoff">
    <p>there was never a box.</p>
    <a href="/redesign/">← home</a>
</div>

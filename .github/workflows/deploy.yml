name: Deploy to Cloudflare Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Strip files that should not be published
        run: |
          rm -rf .github
          find . -name '.DS_Store' -delete
          find . -name '*.icloud' -delete

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy . --project-name=deskofjim --branch=master --commit-hash=${{ github.sha }} --commit-message="${{ github.event.head_commit.message || 'manual run' }}"
